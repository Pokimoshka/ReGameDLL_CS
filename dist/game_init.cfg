// Enables ZBots for the server
// NOTE: ZBots are always enabled on a listen server, regardless of this cvar
// 0 - disabled
// 1 - enabled
//
// Default value: "0"
bot_enable "0"

// Enables the improve AI for hostages from CS:CZ
// 0 - disabled (classic hostage)
// 1 - enabled (improved hostage)
//
// Default value: "0"
hostage_ai_enable "0"

// Sets mins/maxs hull bounds for the player.
// 0 - disabled (default behaviour, sets engine)
// 1 - enabled  (sets gamedll)
//
// Default value: "1"
mp_hullbounds_sets "1"

// Custom weapon accuracy rework (mp_accuracy_mode).
// 0 - disabled (vanilla CS 1.6 behaviour)
// 1 - enabled  (customizable spread / recoil / counter-strafe)
// Default value: "0"
mp_accuracy_mode "0"

// First bullet flies exactly to crosshair when standing / crouching / walk-moving (CS2 style).
// Applies only to weapons that count shots fired (rifles, pistols, SMGs).
// Default value: "1"
mp_accuracy_first_shot "1"

// Spread multipliers per stance.
// Default values: still=0.02, crouch/walk=0.0, move=0.15, air=1.0, still_speed=30
mp_accuracy_still "0.02"
mp_accuracy_walk "0.0"
mp_accuracy_move "0.15"
mp_accuracy_air "1.0"
mp_accuracy_still_speed "30"

// Recoil (punchangle) multipliers per stance.
// Default values: still=0.05, crouch/walk=0.0, move=0.1, air=1.0, air_lateral=0.0
mp_recoil_still "0.05"
mp_recoil_walk "0.0"
mp_recoil_move "0.1"
mp_recoil_air "1.0"
mp_recoil_air_lateral "0.0"

// Extra ground friction when counter-strafing (movement keys pressed against velocity).
// 1.0 - disabled, higher = faster stop, accuracy restores quicker.
// Default value: "2.0"
mp_counterstrafe_friction "2.0"
